name: Remote code tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - name: Build translations and package
        run: |
          sudo apt-get update
          sudo apt-get install --yes gettext
          python -m pip install setuptools
          cd src
          python setup.py build
          test -f build/lib/SystemPlugins/RemoteControlCode/locale/de/LC_MESSAGES/RemoteControlCode.mo
